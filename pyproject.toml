[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrapemapsapi-mcp"
version = "0.1.0"
description = "MCP server for the ScrapeMapsAPI API: Google Maps places, details and reviews for AI assistants"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "ScrapeMapsAPI" }]
keywords = ["mcp", "google-maps", "places", "reviews", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp[cli]>=1.10,<2",  # 2.x renamed FastMCP: the server does not start on it
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://scrapemapsapi.com"
Repository = "https://github.com/scrapemapsapi/mcp-server"
Issues = "https://github.com/scrapemapsapi/mcp-server/issues"
Documentation = "https://scrapemapsapi.com/docs/mcp"

[project.scripts]
scrapemapsapi-mcp = "scrapemapsapi_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scrapemapsapi_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP007", "UP045", "B008"]
